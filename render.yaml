services:
  - type: web
    name: gamepact
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: gamepact-db, property: connectionString }
      - key: ADMIN_USERNAMES
        sync: false
      - key: PUBLIC_URL
        sync: false
databases:
  - name: gamepact-db
